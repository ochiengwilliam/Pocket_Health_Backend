spring.application.name=Pocket_Health

# Server
server.port=${PORT:8080}
server.servlet.context-path=/api/v1

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/pocket_health}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# Database initialization
# Use 'always' only if you intentionally rely on schema.sql/data.sql scripts.
spring.sql.init.mode=${SQL_INIT_MODE:never}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:604800000}

# Groq AI
app.groq.api-key=${GROQ_API_KEY:}
app.groq.model=${GROQ_MODEL:openai/gpt-oss-20b}
app.groq.api-url=${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Optional local secrets
spring.config.import=optional:classpath:application-secrets.properties
