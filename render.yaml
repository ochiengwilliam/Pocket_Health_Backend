services:

  # =======================================================
  # POCKET HEALTH API
  # =======================================================
  - type: web
    name: pocket-health-api
    runtime: docker
    plan: free

    dockerfilePath: ./Dockerfile

    healthCheckPath: /api/v1/actuator/health

    envVars:

      # ---------------------------------------------------
      # PostgreSQL
      # ---------------------------------------------------
      - key: DATABASE_URL
        fromDatabase:
          name: pocket-health-db
          property: connectionString

      - key: DB_USERNAME
        fromDatabase:
          name: pocket-health-db
          property: user

      - key: DB_PASSWORD
        fromDatabase:
          name: pocket-health-db
          property: password

      # ---------------------------------------------------
      # JWT
      # ---------------------------------------------------
      - key: JWT_SECRET
        generateValue: true

      - key: JWT_EXPIRATION
        value: "604800000"

      # ---------------------------------------------------
      # Groq
      # ---------------------------------------------------
      - key: GROQ_API_KEY
        sync: false

      - key: GROQ_MODEL
        value: "openai/gpt-oss-20b"

      - key: GROQ_API_URL
        value: "https://api.groq.com/openai/v1/chat/completions"


# =========================================================
# POSTGRESQL DATABASE
# =========================================================
databases:

  - name: pocket-health-db
    databaseName: pocket_health
    user: pocket_health_user
    plan: free
